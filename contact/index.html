<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Emir Kaan Sari</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1.25rem;
      background: #0f0f0f;
      border-bottom: 1px solid #1e1e1e;
    }
    nav a {
      color: #888;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    nav a:hover, nav a.active { color: #e0e0e0; }
    .container {
      max-width: 640px;
      width: 100%;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 0.75rem; }
    .subtitle { color: #888; font-size: 1rem; margin-bottom: 2.5rem; }
    .links { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; }
    .link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #aaa;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .link:hover { color: #e0e0e0; }
    .link span { color: #444; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/projects">Projects</a>
    <a href="/contact" class="active">Contact</a>
  </nav>
  <div class="container">
    <h1>Contact</h1>
    <p class="subtitle">Feel free to reach out.</p>
    <div class="links">
      <a class="link" href="mailto:you@example.com">
        <span>Email</span> you@example.com
      </a>
      <a class="link" href="#">
        <span>GitHub</span> github.com/username
      </a>
      <a class="link" href="#">
        <span>LinkedIn</span> linkedin.com/in/username
      </a>
      <a class="link" href="#">
        <span>Twitter</span> @username
      </a>
    </div>
  </div>
</body>
</html>
