<style>
/* Layout: one phone-sized stage centred on a night ground; screens swap inside it.
   Single deliberate dark world (a late-night game), so no light variant. */
:root {
  --ground: #0e0c12;
  --bg: #17131d;
  --surface: #211b29;
  --surface-2: #2b2335;
  --line: #3b3147;
  --fg: #f5eee7;
  --muted: #a99db4;
  --ember: #ff8a5b;
  --on-ember: #24110a;
  --ember-soft: rgba(255, 138, 91, 0.15);
  --spark: #ffc857;
  --spark-soft: rgba(255, 200, 87, 0.16);
  --sync: #8fd3c1;
  --sync-soft: rgba(143, 211, 193, 0.15);
  --o1: #e8705f; --o2: #6a93ec; --o3: #e3b04b; --o4: #55b48e;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground); color: var(--fg);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
  display: flex; justify-content: center; align-items: center;
  padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }

.phone {
  width: 100%; max-width: 400px; height: 100%; max-height: 840px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 28px;
  overflow: hidden; display: flex; flex-direction: column; position: relative;
}
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 20px 10px; border-bottom: 1px solid var(--line); flex: none;
}
.brand { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.brand b { color: var(--ember); font-weight: 800; }
.rounds { display: flex; gap: 5px; }
.rounds i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); display: block; }
.rounds i.done { background: var(--ember); }
.rounds i.now { background: var(--fg); }
.count { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.screen { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.screen.center { justify-content: center; }
.grow { flex: 1; }

h1, h2, h3 { font-family: var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1.05; font-weight: 800; }
h2 { font-size: 26px; line-height: 1.12; font-weight: 700; }
h3 { font-size: 13px; font-family: var(--body); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ember); }

.btn {
  display: block; width: 100%; border: 0; border-radius: 14px; cursor: pointer;
  padding: 15px 18px; font-weight: 600; font-size: 16px;
  background: var(--ember); color: var(--on-ember);
}
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.quiet { background: transparent; color: var(--muted); padding: 10px; font-weight: 500; }
.actions { display: flex; flex-direction: column; gap: 8px; }

/* Intro */
.logo { font-family: var(--display); font-weight: 800; font-size: 64px; letter-spacing: -0.05em; line-height: 0.9; }
.logo b { color: var(--ember); font-weight: 800; }
.lede { font-size: 17px; line-height: 1.5; max-width: 32ch; }
.fine { font-size: 12px; color: var(--muted); text-align: center; }

/* Form */
.field { display: flex; flex-direction: column; gap: 8px; }
.field label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  color: var(--fg); font: inherit; padding: 12px 14px;
}
textarea { resize: none; min-height: 92px; }
input[type="text"]:focus, textarea:focus { border-color: var(--ember); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-size: 14px; cursor: pointer;
}
.chip.on { background: var(--ember-soft); border-color: var(--ember); color: var(--fg); }
.range-row { display: flex; align-items: center; gap: 12px; }
.range-row input { flex: 1; min-width: 0; accent-color: var(--ember); }
.range-val { font-family: var(--mono); font-size: 14px; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--spark); min-height: 18px; }

/* Avatars and platform */
.tok { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
.tok .av { width: 44px; height: 44px; border-radius: 50%; display: block; }
.tok .av svg { width: 100%; height: 100%; display: block; border-radius: 50%; }
.tok .nm { font-size: 11px; color: var(--muted); max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tok.synced .av { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--sync); }
.tok.sparked .av { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--spark); }
.tok.me .av { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ember); }
.tok.me .nm { color: var(--fg); font-weight: 600; }
.tok.crowd .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--line); display: block; margin: 4px; }
.stage { position: relative; overflow: hidden; border-radius: 22px; padding-bottom: 72px; margin-bottom: -60px; }
.platform {
  position: relative; background: var(--surface); border-radius: 22px;
  border-bottom: 8px solid var(--surface-2);
  padding: 18px 14px; min-height: 150px;
  display: flex; flex-wrap: wrap; gap: 10px 8px; justify-content: center; align-content: center; align-items: center;
}
.platform.big .tok .av { width: 52px; height: 52px; }
.split-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.bigcount { font-family: var(--mono); font-size: 40px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.bigcount small { font-size: 15px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.notes { display: flex; flex-direction: column; gap: 8px; min-height: 20px; }
.note { background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; border-left: 3px solid var(--line); animation: rise .4s ease both; }
.note.sp { border-left-color: var(--spark); }
.note.back { border-left-color: var(--sync); }

@keyframes fall {
  0% { transform: translateY(0) rotate(0); opacity: 1; }
  15% { transform: translateY(-8px) rotate(-6deg); opacity: 1; }
  100% { transform: translateY(320px) rotate(38deg); opacity: 0; }
}
@keyframes dropin {
  0% { transform: translateY(-220px); opacity: 0; }
  70% { transform: translateY(6px); opacity: 1; }
  100% { transform: none; opacity: 1; }
}
@keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--sync); } 50% { box-shadow: 0 0 0 2px var(--bg), 0 0 0 9px var(--sync-soft); } }
.falling { animation: fall 0.9s cubic-bezier(0.5, 0, 0.9, 0.4) forwards; }
.falling.slow { animation-duration: 2.6s; }
.dropin { animation: dropin 1s cubic-bezier(0.2, 0.8, 0.3, 1.2) both; }

/* Question */
.qcard { background: var(--surface); border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: var(--sync-soft); color: var(--sync); align-self: flex-start; }
.tag.wild { background: var(--spark-soft); color: var(--spark); }
.tag.strong { background: var(--ember-soft); color: var(--ember); }
.timer { display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ember); transform-origin: left; }
.tnum { font-family: var(--mono); font-size: 15px; width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; cursor: pointer;
  padding: 14px 12px; min-height: 96px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  font-size: 15px; font-weight: 500; line-height: 1.3;
}
.opt .g { font-size: 16px; line-height: 1; }
.opt:nth-child(1) .g { color: var(--o1); } .opt:nth-child(2) .g { color: var(--o2); }
.opt:nth-child(3) .g { color: var(--o3); } .opt:nth-child(4) .g { color: var(--o4); }
.opt:hover { border-color: var(--muted); }
.slider-wrap { display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
.slider-wrap input { width: 100%; accent-color: var(--ember); }
.slider-ends { display: flex; justify-content: space-between; font-family: var(--display); font-weight: 700; font-size: 18px; }
.play { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
.play button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ember); color: var(--on-ember); cursor: pointer; font-size: 14px; flex: none; }
.wave { display: flex; gap: 3px; align-items: center; height: 28px; flex: 1; min-width: 0; overflow: hidden; }
.wave i { width: 3px; border-radius: 2px; background: var(--muted); display: block; flex: none; }
.wave.on i { background: var(--ember); }

/* Sync + spark */
.sync-hero { display: flex; justify-content: center; gap: 14px; padding: 8px 0; }
.sync-hero .tok .av { width: 72px; height: 72px; animation: glow 2.4s ease-in-out infinite; }
.sync-hero .tok .nm { font-size: 14px; color: var(--fg); max-width: 90px; }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 12px; }
.cand { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 6px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cand .tok .av { width: 52px; height: 52px; }
.cand.on { border-color: var(--spark); background: var(--spark-soft); }

/* Finalists + reveal */
.fcards { display: flex; flex-direction: column; gap: 10px; }
.fcard { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; cursor: pointer; text-align: left; width: 100%; }
.fcard .tok .av { width: 58px; height: 58px; }
.fcard .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fcard .name { font-family: var(--display); font-weight: 700; font-size: 19px; }
.status { font-size: 12px; color: var(--muted); }
.status.sent { color: var(--sync); }
.window { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-radius: 14px; padding: 10px 14px; font-size: 13px; }
.window .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); }
.crown { font-size: 13px; color: var(--spark); font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }

.prof-head { display: flex; gap: 16px; align-items: center; }
.prof-head .tok .av { width: 84px; height: 84px; }
.backlink { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; font-size: 14px; align-self: flex-start; }
.section { display: flex; flex-direction: column; gap: 10px; }
.timeline { display: flex; flex-direction: column; border-left: 2px solid var(--line); margin-left: 6px; }
.tl { position: relative; padding: 0 0 14px 18px; }
.tl::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); }
.tl.hit::before { border-color: var(--sync); background: var(--sync); }
.tl.sp::before { border-color: var(--spark); background: var(--spark); }
.tl .r { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tl .ev { font-size: 14px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare div { background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; min-width: 0; }
.compare b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.compare .same { outline: 1px solid var(--sync); }
.quote { background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.quote .q { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.quote .a { font-size: 15px; }

.toast {
  position: absolute; left: 16px; right: 16px; bottom: 16px; background: var(--fg); color: var(--bg);
  border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 500;
  transform: translateY(140%); transition: transform 0.3s ease; pointer-events: none;
}
.toast.show { transform: none; }

.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.stat { background: var(--surface); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .n { font-family: var(--mono); font-size: 26px; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

@media (prefers-reduced-motion: reduce) {
  .falling, .falling.slow { animation: none; opacity: 0; transition: opacity 0.3s; }
  .dropin, .note { animation: none; }
  .sync-hero .tok .av { animation: none; }
}
@media (max-width: 440px) {
  body { padding-block: 8px; }
  .phone { border-radius: 20px; max-height: none; }
  h1 { font-size: 30px; }
}
</style>

function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

/* ---------- Scoring ---------- */
const zero = () => [0, 0, 0, 0, 0];
const add = (a, b, k = 1) => a.map((x, i) => x + b[i] * k);
function textDelta(s) {
  const t = (s || '').toLowerCase(); let d = zero(), hit = false;
  const R = (re, v) => { if (re.test(t)) { d = add(d, v); hit = true; } };
  R(/friend|people|family|mum|mom|dad|table|everyone|crew|brother|sister|talk|together|party/, [1, 1, 0, 0, 0]);
  R(/sea|forest|mountain|nature|ridge|island|balcony|garden|tent|beach|plant|lake|sky/, [0, 0, 0.5, 0, 1]);
  R(/city|street|train|road|wherever|2am|stage|show|festival|drive|driving|travel/, [0.5, 0, 1, 0, 0]);
  R(/quiet|library|bed|book|alone|silence|rain/, [-0.5, 1, 0, 0, 1]);
  R(/kitchen|food|cook|tea|bread|pancake|eat|meal|coffee/, [0, 1.5, 0, 0, 0]);
  R(/old|grand|childhood|used to|miss|remember|last|first|cassette|radio/, [0, 0, 0, 1.5, 0]);
  if (!hit && t.trim()) d[4] += 1;
  if (t.length > 50) d[4] += 0.5;
  return d;
}
function roundDelta(r, ans) {
  const R = ROUNDS[r];
  if (ans == null) return zero();
  if (R.type === 'choice') return R.opts[ans].d;
  if (R.type === 'slider') return [0, -(ans - 50) / 40, (ans - 50) / 20, 0, 0];
  if (R.type === 'music') {
    let d = zero();
    (ans.chips || []).forEach(c => { const ch = R.chips.find(x => x.k === c); if (ch) d = add(d, ch.d); });
    return add(d, textDelta(ans.text), 0.5);
  }
  return textDelta(ans);
}
function vecUpTo(answers, n) { let v = zero(); for (let r = 0; r < n; r++) v = add(v, roundDelta(r, answers[r])); return v; }
function weights() {
  const w = [1, 1, 1, 1, 1];
  S.me.prios.forEach(k => { const p = PRIOS.find(x => x.k === k); if (p) w[p.d] = 1.6; });
  return w;
}
const sparkedIds = () => Object.values(S.sparks);
const SPARKS_PER_GAME = 1, SPARK_FROM_ROUND = 2; // one spark per game, once faces are visible
const canSpark = () => S.round >= SPARK_FROM_ROUND && Object.keys(S.sparks).length < SPARKS_PER_GAME;
function dist(id, n) {
  const u = vecUpTo(S.answers, n), v = vecUpTo(P(id).a, n), w = weights();
  let s = 0; for (let i = 0; i < 5; i++) s += w[i] * (u[i] - v[i]) ** 2;
  let d = Math.sqrt(s);
  if (sparkedIds().includes(id)) d *= 0.8;
  return d + (hash(id) % 100) / 1000; // stable tie-break
}
const byDist = n => (a, b) => dist(a, n) - dist(b, n);

/* ---------- State ---------- */
function fresh(me) {
  return {
    screen: 'intro', round: 0,
    me: me || { name: '', gender: '', seeking: '', ageMin: 22, ageMax: 32, intent: '', prios: [] },
    answers: [null, null, null, null, null], chips: [],
    bucket: [], pool: [], fallen: [], fellAt: {}, known: [], sparks: {}, sparkSel: null,
    log: {}, syncNow: [], lastSplit: null, finalists: [], wild: null, decisions: {}, open: null, drafts: {}
  };
}
let S = fresh();
const log = (id, r, text, kind = '') => { (S.log[id] = S.log[id] || []).push({ r, text, kind }); };

function startGame() {
  const want = S.me.seeking === 'Women' ? ['w'] : S.me.seeking === 'Men' ? ['m'] : ['w', 'm'];
  S.pool = PLAYERS.filter(p => want.includes(p.g)).map(p => p.id);
  const crowd = Array.from({ length: CROWD_TOTAL - S.pool.length }, (_, i) => 'c' + (i + 1));
  const mixed = []; const a = [...S.pool], b = [...crowd];
  while (a.length || b.length) { if (b.length) mixed.push(b.shift()); if (b.length) mixed.push(b.shift()); if (a.length) mixed.push(a.shift()); }
  S.bucket = mixed;
  S.round = 0; S.answers = [null, null, null, null, null];
  S.fallen = []; S.fellAt = {}; S.known = []; S.sparks = {}; S.log = {}; S.decisions = {}; S.drafts = {}; S.finalists = []; S.wild = null;
}

function faceOn(id) { return isRich(id) && (S.round >= 2 || S.known.includes(id) || sparkedIds().includes(id)); }

function findSync(r) {
  const R = ROUNDS[r], a = S.answers[r];
  if (a == null) return [];
  if (R.type === 'music' && !(a.chips.length || a.text.trim())) return [];
  if (R.type === 'text' && !a.trim()) return [];
  const ids = S.bucket.filter(isRich);
  const scored = ids.map(id => {
    const pa = P(id).a[r]; let s;
    if (R.type === 'choice') s = pa === a ? 0 : 6;
    else if (R.type === 'slider') s = Math.abs(pa - a) / 10;
    else {
      const d1 = roundDelta(r, a), d2 = roundDelta(r, pa);
      s = Math.hypot(...d1.map((x, i) => x - d2[i]));
      if (R.type === 'music') s -= pa.chips.filter(c => a.chips.includes(c)).length * 2;
    }
    return { id, s: s + dist(id, r + 1) * 0.15 };
  }).sort((x, y) => x.s - y.s);
  if (!scored.length) return [];
  const out = [scored[0].id];
  if (scored[1] && scored[1].s - scored[0].s < 0.6) out.push(scored[1].id);
  return out;
}

function doSplit(r) {
  const n = r + 1, before = [...S.bucket];
  const rich = before.filter(isRich).sort(byDist(n));
  const crowd = before.filter(id => !isRich(id));
  let reunion = null, keep;
  if (r === 3) {
    const gone = S.fallen.filter(id => isRich(id) && (S.fellAt[id] === 2 || S.known.includes(id))).sort(byDist(n));
    if (gone.length) reunion = gone[0];
  }
  if (r === 4) {
    const top = rich.slice(0, 2), rest = rich.slice(2);
    const u = vecUpTo(S.answers, n);
    let best = null, bestGap = -1, bestDim = 0;
    rest.forEach(id => {
      const v = vecUpTo(P(id).a, n);
      v.forEach((x, i) => { const g = Math.abs(x - u[i]); if (g > bestGap) { bestGap = g; best = id; bestDim = i; } });
    });
    keep = best ? [...top, best] : rich.slice(0, 3);
    S.wild = best ? { id: best, dim: DIMS[bestDim] } : null;
    S.finalists = keep;
  } else {
    const slots = KEEP[r] - (reunion ? 1 : 0);
    keep = rich.slice(0, slots);
    if (keep.length < slots) keep = keep.concat(crowd.slice(0, slots - keep.length));
  }
  const falling = before.filter(id => !keep.includes(id));
  falling.forEach(id => { S.fallen.push(id); S.fellAt[id] = r; if (isRich(id) && faceOn(id)) log(id, r, 'Fell to another platform'); });
  if (reunion) {
    keep.push(reunion);
    S.fallen = S.fallen.filter(x => x !== reunion);
    log(reunion, r, 'Came back to your platform', 'hit');
  }
  S.bucket = keep;
  S.lastSplit = { r, before, falling, reunion, keepCount: keep.length };
  if (r === 4) {
    keep.forEach(id => {
      log(id, r, 'Made it to the end with you', 'hit');
      if (hash(id) % 2 === 0) log(id, 3, 'Sparked you', 'sp');
    });
  }
}

/* ---------- Audio clip for the music round ---------- */
let AC = null;
function playClip() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + 0.05;
    const master = AC.createGain(); master.gain.value = 0.22;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    master.connect(lp); lp.connect(AC.destination);
    const voice = (f, s, d, type, vol) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(vol, s + 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(master); o.start(s); o.stop(s + d + 0.05);
    };
    const chords = [[220, 261.63, 329.63], [174.61, 220, 261.63], [196, 261.63, 329.63], [196, 246.94, 293.66]];
    chords.forEach((c, i) => c.forEach(f => voice(f, t0 + i * 2, 2.3, 'triangle', 0.18)));
    [659.25, 587.33, 523.25, 493.88, 440, 523.25, 493.88, 392].forEach((f, i) => voice(f, t0 + i, 0.95, 'sine', 0.22));
    const w = document.getElementById('wave'); if (w) { w.classList.add('on'); setTimeout(() => w.classList.remove('on'), 8200); }
  } catch (e) { toast('Sound is unavailable here. Answer from the title alone.'); }
}

  const cands = S.bucket.filter(id => faceOn(id) && !sparkedIds().includes(id));
  const grid = cands.length
    ? `<div class="cands">${cands.map(id => `<button class="cand ${S.sparkSel === id ? 'on' : ''}" data-act="sel" data-id="${id}" aria-pressed="${S.sparkSel === id}">${tok(id)}</button>`).join('')}</div>`
    : '<p class="muted">Nobody to spark yet. Faces show up as the room gets smaller, or when you sync with someone.</p>';
  return `
  <div class="screen">
    <div><p class="eyebrow">Spark · one per game</p><h2>Anyone catch your eye?</h2></div>
    <p class="muted small">You get one spark per game. It nudges who stays with you, and they'll see it at the reveal. Use it now or keep it for a later round.</p>
    ${grid}
    <div class="grow"></div>
    <div class="actions">
      ${cands.length ? `<button class="btn" data-act="sendSpark" ${S.sparkSel ? '' : 'disabled'}>Send spark${S.sparkSel ? ' to ' + esc(P(S.sparkSel).name) : ''}</button>` : ''}
      <button class="btn ${cands.length ? 'quiet' : ''}" data-act="skipSpark">${!cands.length ? 'Continue' : S.round < 4 ? 'Keep it for later' : 'Don\'t use it'}</button>
    </div>
  </div>`;
};

V.split = () => {
  const L = S.lastSplit;
  const shown = L.before;
  const last = L.r === 4;
  return `
  <div class="screen">
    <div class="split-meta">
      <div><p class="eyebrow">Round ${L.r + 1} · the split</p><h2>${last ? 'Final platform' : 'The room is moving'}</h2></div>
    </div>
    <div class="bigcount"><span id="bigcount">${shown.length}</span><small>with you</small></div>
    <div class="stage"><div class="platform big" id="platform">${shown.map(id => tok(id)).join('')}</div></div>
    <div class="notes" id="notes" aria-live="polite"></div>
    <div class="grow"></div>
    <div class="actions"><button class="btn" id="nextBtn" data-act="next" disabled>${last ? 'Meet your finalists' : 'Next round'}</button></div>
  </div>`;
};

V.finalists = () => {
  const done = S.finalists.every(id => S.decisions[id]);
  return `
  <div class="screen">
    <div><p class="crown">Finalists</p><h1>These are your people tonight</h1></div>
    <p class="muted">You're their finalist too. Profiles and answers are open now.</p>
    <div class="window"><span class="muted">Reveal window closes in</span><span class="mono" id="clock">72:00:00</span></div>
    <div class="fcards">${S.finalists.map(id => {
      const p = P(id), wild = S.wild && S.wild.id === id;
      const syncs = (S.log[id] || []).filter(e => e.text.startsWith('Synced')).map(e => e.text.replace('Synced on ', ''));
      const reason = wild ? `You differ on ${DIM_WORDS[S.wild.dim]}. The rest lines up.` : syncs.length ? `Synced on ${syncs.join(', ')}` : 'Close across the board';
      const st = S.decisions[id];
      return `<button class="fcard" data-act="open" data-id="${id}">
        ${tok(id)}
        <span class="info">
          <span class="name">${esc(p.name)}, ${p.age}</span>
          <span class="tag ${wild ? 'wild' : 'strong'}">${wild ? 'Wildcard' : 'Strong match'}</span>
          <span class="small muted">${esc(reason)}</span>
          <span class="status ${st === 'sent' ? 'sent' : ''}">${st === 'sent' ? 'Request sent' : st === 'passed' ? 'Passed quietly' : `${p.km} km away · tap to see the story`}</span>
        </span></button>`;
    }).join('')}</div>
    <div class="grow"></div>
    <div class="actions"><button class="btn ${done ? '' : 'ghost'}" data-act="finish" ${done ? '' : 'disabled'}>${done ? 'Finish this run' : 'Message or pass each finalist to finish'}</button></div>
  </div>`;
};

V.profile = () => {
  const id = S.open, p = P(id), [He] = pron(id);
  const events = S.log[id] || [];
  const rows = ROUNDS.map((R, r) => {
    const ev = events.filter(e => e.r === r);
    if (!ev.length) return `<div class="tl"><div class="r">Round ${r + 1} · ${R.theme}</div><div class="ev muted">On the same platform</div></div>`;
    return ev.map(e => `<div class="tl ${e.kind}"><div class="r">Round ${r + 1} · ${R.theme}</div><div class="ev">${esc(e.text)}</div></div>`).join('');
  }).join('');
  const anchor = ROUNDS[4], mine = S.answers[4], theirs = p.a[4];
  const same = mine === theirs;
  const myQ = ROUNDS[3].q;
  const starters = [
    `Tell me more about "${trunc(p.a[3], 42)}"`,
    same ? `We'd both run back in for the same thing. Explain yourself.` : `You'd save "${trunc(anchor.opts[theirs].t, 34)}" from a fire? Defend it.`,
    `Question swap? Yours was "${p.own[0]}" Mine was "${myQ}"`
  ];
  const st = S.decisions[id];
  const composer = st ? `<p class="status ${st === 'sent' ? 'sent' : ''}">${st === 'sent' ? `Request sent. ${p.name} sees it next to your shared story.` : `Passed quietly. ${p.name} won't be told.`}</p>` : `
    <div class="section"><h3>Send a message request</h3>
      <div class="chips">${starters.map((s, i) => `<button class="chip" data-act="starter" data-i="${i}">${esc(trunc(s, 46))}</button>`).join('')}</div>
      <textarea id="f-msg" maxlength="300" placeholder="Start from something you shared">${esc(S.drafts[id] || '')}</textarea>
      <div class="actions"><button class="btn" data-act="send">Send request</button><button class="btn quiet" data-act="pass">Pass quietly</button></div>
    </div>`;
  S._starters = starters;
  return `
  <div class="screen">
    <button class="backlink" data-act="back">← Finalists</button>
    <div class="prof-head">${tok(id)}<div><h2>${esc(p.name)}, ${p.age}</h2><p class="muted small">${p.km} km away · also looking for ${esc((S.me.intent || 'something real').toLowerCase())}</p></div></div>
    <p>${esc(p.bio)}</p>
    <div class="section"><h3>Your story together</h3><div class="timeline">${rows}</div></div>
    <div class="section"><h3>Same question, both of you</h3><p class="small muted">${esc(anchor.q)}</p>
      <div class="compare"><div class="${same ? 'same' : ''}"><b>You</b>${mine == null ? '<span class="muted">Time ran out</span>' : esc(anchor.opts[mine].t)}</div><div class="${same ? 'same' : ''}"><b>${esc(p.name)}</b>${esc(anchor.opts[theirs].t)}</div></div></div>
    <div class="section"><h3>What ${He.toLowerCase()} said</h3>
      <div class="quote"><div class="q">The song was the soundtrack to</div><div class="a">“${esc(p.a[2].text)}”</div></div>
      <div class="quote"><div class="q">Home, without the address</div><div class="a">“${esc(p.a[3])}”</div></div>
      <div class="quote"><div class="q">A question you never got: ${esc(p.own[0])}</div><div class="a">“${esc(p.own[1])}”</div></div>
    </div>
    ${composer}
  </div>`;
};

V.end = () => {
  const synced = new Set(Object.entries(S.log).filter(([, ev]) => ev.some(e => e.text.startsWith('Synced'))).map(([id]) => id)).size;
  const sent = Object.values(S.decisions).filter(x => x === 'sent').length;
  return `
  <div class="screen">
    <div><p class="eyebrow">Run complete</p><h1>That's the run</h1></div>
    <div class="stats">
      <div class="stat"><span class="n">${synced}</span><span class="l">people synced</span></div>
      <div class="stat"><span class="n">${Object.keys(S.sparks).length}/${SPARKS_PER_GAME}</span><span class="l">spark used</span></div>
      <div class="stat"><span class="n">${sent}</span><span class="l">requests sent</span></div>
    </div>
    <div class="section"><h3>What happens next</h3>
      <ul class="plain">
        <li>Each person you messaged sees your request with your shared story, then accepts or passes quietly.</li>
        <li>Finalists you didn't act on expire when the 72-hour window closes.</li>
        <li>Your next game unlocks when enough new people near you have played.</li>
      </ul></div>
    <p class="muted small">In this prototype you can play again right away. Answer differently and different people will stay with you.</p>
    <div class="grow"></div>
    <div class="actions"><button class="btn" data-act="again">Play again</button><button class="btn quiet" data-act="go" data-to="finalists">Back to finalists</button></div>
  </div>`;
};

/* ---------- Render + timers ---------- */
let T = null, clockT = null;
const clearTimers = () => { clearInterval(T); T = null; clearInterval(clockT); clockT = null; };
function render() {
  clearTimers();
  const app = $('#app');
  app.innerHTML = bar() + V[S.screen]();
  const sc = app.querySelector('.screen'); if (sc) sc.scrollTop = 0;
  if (S.screen === 'question') startTimer();
  if (S.screen === 'split') runSplit();
  if (S.screen === 'finalists') startClock();
}

function startTimer() {
  const R = ROUNDS[S.round], total = R.time * 1000, end = Date.now() + total;
  const tick = () => {
    const left = Math.max(0, end - Date.now());
    const b = $('#tbar'), n = $('#tnum');
    if (b) b.style.transform = `scaleX(${left / total})`;
    if (n) n.textContent = Math.ceil(left / 1000);
    if (left <= 0) { clearInterval(T); T = null; timeUp(); }
  };
  tick(); T = setInterval(tick, 100);
}
function currentAnswer() {
  const R = ROUNDS[S.round];
  if (R.type === 'slider') return Number(($('#f-slider') || { value: 50 }).value);
  if (R.type === 'music') return { chips: [...S.chips], text: ($('#f-text') || { value: '' }).value };
  if (R.type === 'text') return ($('#f-text') || { value: '' }).value;
  return null;
}
function timeUp() {
  const R = ROUNDS[S.round];
  toast(R.type === 'choice' ? "Time's up. No answer this round." : "Time's up. Locked in what you had.");
  submit(currentAnswer());
}
function submit(val) {
  clearTimers();
  const r = S.round;
  S.answers[r] = val;
  S.syncNow = findSync(r);
  S.syncNow.forEach(id => { if (!S.known.includes(id)) S.known.push(id); log(id, r, 'Synced on ' + ROUNDS[r].theme, 'hit'); });
  S.chips = []; S.sparkSel = null;
  S.screen = 'sync'; render();
}

function runSplit() {
  const L = S.lastSplit, plat = $('#platform'), notes = $('#notes'), big = $('#bigcount'), hdr = $('#hdrcount');
  const sp = sparkedIds();
  const order = [...L.falling.filter(id => !isRich(id)), ...L.falling.filter(id => isRich(id) && !sp.includes(id) && !S.known.includes(id)),
    ...L.falling.filter(id => isRich(id) && S.known.includes(id) && !sp.includes(id)), ...L.falling.filter(id => sp.includes(id))];
  const many = order.length > 10;
  let delay = 500;
  const startN = L.before.length, endN = L.keepCount - (L.reunion ? 1 : 0);
  order.forEach((id, i) => {
    const el = plat.querySelector(`[data-id="${id}"]`);
    const slow = sp.includes(id), known = isRich(id) && faceOn(id) && (S.known.includes(id) || slow);
    setTimeout(() => {
      if (el) { el.classList.add('falling'); if (slow) el.classList.add('slow'); }
      const n = startN - i - 1; big.textContent = n; if (hdr) hdr.textContent = n + ' with you';
      if (known) {
        const [He] = pron(id);
        notes.insertAdjacentHTML('beforeend', `<div class="note ${slow ? 'sp' : ''}">${esc(P(id).name)} fell to another platform. ${He}'s still playing, just not with you.</div>`);
      }
    }, delay);
    delay += slow ? 1400 : known ? 520 : many ? 45 : 200;
  });
  let endAt = delay + 700;
  if (L.reunion) {
    const id = L.reunion;
    setTimeout(() => {
      plat.insertAdjacentHTML('beforeend', tok(id, 'dropin'));
      const n = endN + 1; big.textContent = n; if (hdr) hdr.textContent = n + ' with you';
      notes.insertAdjacentHTML('beforeend', `<div class="note back">${esc(P(id).name)} is back. Your last answers pulled you together again.</div>`);
    }, delay + 400);
    endAt = delay + 1500;
  }
  setTimeout(() => {
    const b = $('#nextBtn'); if (b) b.disabled = false;
    if (!notes.children.length) notes.insertAdjacentHTML('beforeend', `<div class="note">${L.falling.length} people moved to other platforms.</div>`);
  }, endAt);
}

function startClock() {
  const end = Date.now() + 72 * 3600 * 1000;
  const tick = () => {
    const s = Math.max(0, Math.floor((end - Date.now()) / 1000));
    const pad = x => String(x).padStart(2, '0');
    const c = $('#clock'); if (c) c.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  };
  tick(); clockT = setInterval(tick, 1000);
}

/* ---------- Actions ---------- */
const A = {
  go: d => { S.screen = d.to; render(); },
  set: d => { S.me[d.k] = d.v; render(); },
  prio: d => {
    const p = S.me.prios, i = p.indexOf(d.v);
    if (i >= 0) p.splice(i, 1); else { p.push(d.v); if (p.length > 2) p.shift(); }
    render();
  },
  toLobby: () => {
    const m = S.me, miss = [];
    if (!m.name.trim()) miss.push('your first name');
    if (!m.gender) miss.push('who you are');
    if (!m.seeking) miss.push('who to show you');
    if (!m.intent) miss.push('what you are looking for');
    if (miss.length) { $('#hint').textContent = 'Add ' + miss.join(', ') + ' to continue.'; return; }
    S.screen = 'lobby'; render();
  },
  enter: () => { startGame(); S.screen = 'roundIntro'; render(); },
  showQ: () => { S.screen = 'question'; S.chips = []; render(); if (ROUNDS[S.round].type === 'music') playClip(); },
  replay: () => playClip(),
  pick: d => submit(Number(d.i)),
  mchip: d => {
    const i = S.chips.indexOf(d.v);
    if (i >= 0) S.chips.splice(i, 1); else S.chips.push(d.v);
    document.querySelectorAll('[data-act="mchip"]').forEach(b => { const on = S.chips.includes(b.dataset.v); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  },
  lock: () => submit(currentAnswer()),
  toSpark: () => {
    if (canSpark() && S.bucket.some(id => faceOn(id))) { S.screen = 'spark'; render(); }
    else { doSplit(S.round); S.screen = 'split'; render(); }
  },
  sel: d => { S.sparkSel = S.sparkSel === d.id ? null : d.id; render(); },
  sendSpark: () => {
    if (!S.sparkSel) return;
    S.sparks[S.round] = S.sparkSel; log(S.sparkSel, S.round, 'You sparked ' + pron(S.sparkSel)[1], 'sp');
    doSplit(S.round); S.screen = 'split'; render();
  },
  skipSpark: () => { doSplit(S.round); S.screen = 'split'; render(); },
  next: () => {
    if (S.round < 4) { S.round++; S.screen = 'roundIntro'; } else S.screen = 'finalists';
    render();
  },
  open: d => { S.open = d.id; S.screen = 'profile'; render(); },
  back: () => { S.screen = 'finalists'; render(); },
  starter: d => { const t = $('#f-msg'); t.value = S._starters[Number(d.i)]; S.drafts[S.open] = t.value; t.focus(); },
  send: () => {
    const t = $('#f-msg'), v = t ? t.value.trim() : '';
    if (!v) { toast('Write a first line, or tap a starter.'); return; }
    S.decisions[S.open] = 'sent'; toast(`Request sent to ${P(S.open).name}.`);
    S.screen = 'finalists'; render();
  },
  pass: () => { S.decisions[S.open] = 'passed'; toast(`Passed. ${P(S.open).name} won't be told.`); S.screen = 'finalists'; render(); },
  finish: () => { S.screen = 'end'; render(); },
  again: () => { S = fresh(S.me); S.screen = 'lobby'; render(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-name') S.me.name = t.value;
  if (t.id === 'f-amin' || t.id === 'f-amax') {
    let lo = Number($('#f-amin').value), hi = Number($('#f-amax').value);
    if (lo > hi) { if (t.id === 'f-amin') hi = lo; else lo = hi; $('#f-amin').value = lo; $('#f-amax').value = hi; }
    S.me.ageMin = lo; S.me.ageMax = hi; $('#f-aval').textContent = `${lo}–${hi}`;
  }
  if (t.id === 'f-msg') S.drafts[S.open] = t.value;
});

/* ---------- Boot (keeps progress across live updates) ---------- */
function start(data) { if (data && data.S) S = data.S; render(); }
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body></html>
