<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Soulit Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: a phone-sized game arena under a night sky; a HUD on top, one scene at a time.
   One deliberate world (a late-night game show: Fall Guys platforms, Kahoot tiles), so no light variant. */
:root {
  --ground: #110724;
  --sky: #22104a;
  --sky-2: #2c1561;
  --sky-3: #3d1f80;
  --shadow: #0c041d;
  --ink: #fff8ec;
  --muted: #c6b8ec;
  --dark-ink: #1c0f38;
  --pink: #ff4fa3; --pink-d: #b92671;
  --yellow: #ffd23f; --yellow-d: #c4930c;
  --mint: #3ddc97; --mint-d: #1b9762;
  --blue: #4cc9f0; --blue-d: #1a86ad;
  --coral: #ff6b4a; --coral-d: #bd3e1c;
  --tile: #ff9fd0; --tile-d: #bf4f8d;
  --glass: rgba(12, 4, 29, 0.55);
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--ground);
  background-image: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,.35), transparent 60%);
  background-size: 180px 180px;
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.35;
  display: flex; justify-content: center; align-items: center;
  padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
em { font-style: normal; color: var(--yellow); }

.phone {
  width: 100%; max-width: 400px; height: 100%; max-height: 840px; position: relative;
  background-color: var(--sky);
  background-image: radial-gradient(120% 60% at 50% 0%, var(--sky-3), transparent 70%),
    radial-gradient(1.5px 1.5px at 15% 20%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1px 1px at 80% 12%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 60% 45%, rgba(255,255,255,.35), transparent 60%);
  background-size: 100% 100%, 140px 140px, 160px 160px, 120px 120px;
  border: 3px solid #4a2a8f; border-radius: 32px; box-shadow: 0 0 0 6px var(--shadow), 0 30px 60px rgba(0,0,0,.5);
  overflow: hidden; display: flex; flex-direction: column;
}
.phone.shake { animation: shake .45s; }

/* HUD */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 6px; flex: none; }
.hud-r { display: flex; gap: 6px; align-items: center; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .01em; }
.brand b, .logo b { color: var(--pink); font-weight: 400; }
.pill {
  background: var(--glass); border: 2px solid rgba(255,255,255,.14); border-radius: 999px;
  padding: 3px 11px; font-family: var(--display); font-size: 16px; display: inline-flex; align-items: center; gap: 6px;
  font-variant-numeric: tabular-nums; cursor: default;
}
.pill.icon { padding: 5px 8px; cursor: pointer; }
.pill svg { width: 16px; height: 16px; display: block; }
.pill.spark { color: var(--yellow); }
.pill.spark.used { color: var(--muted); opacity: .6; }
.mini-bean { width: 10px; height: 15px; border-radius: 6px; background: var(--pink); display: inline-block; box-shadow: inset -2px -2px 0 rgba(0,0,0,.2); }
.pips { display: flex; gap: 6px; align-items: center; }
.pips i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.2); display: block; }
.pips i.done { background: var(--yellow); border-color: var(--yellow-d); }
.pips i.now { background: var(--pink); border-color: #fff; animation: pulse 1s ease-in-out infinite; }

/* Scenes */
.scene { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 18px 22px; display: flex; flex-direction: column; gap: 16px; position: relative; }
.scene.center { justify-content: center; text-align: center; }
.grow { flex: 1; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.fine { font-size: 13px; color: var(--muted); text-align: center; }
.eyebrow { font-family: var(--display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
.slam {
  font-family: var(--display); font-size: 56px; line-height: .92; text-transform: uppercase; letter-spacing: .01em;
  text-shadow: 0 5px 0 var(--shadow); text-wrap: balance; animation: slam .45s cubic-bezier(.2,1.5,.4,1) both;
}
.slam.sm { font-size: 34px; text-shadow: 0 4px 0 var(--shadow); }
.slam.huge { font-size: 84px; }
.slam.y { color: var(--yellow); }
.slam.m { color: var(--mint); }
.slam.p { color: var(--pink); }
.line { font-family: var(--display); font-size: 25px; line-height: 1.12; font-weight: 400; margin: 0; text-wrap: balance; }
.lede { font-size: 18px; line-height: 1.4; font-weight: 600; }
.sticker {
  display: inline-block; align-self: center; font-family: var(--display); font-size: 20px; text-transform: lowercase;
  background: var(--yellow); color: var(--dark-ink); padding: 4px 14px 2px; border-radius: 12px; transform: rotate(-4deg);
  box-shadow: 0 4px 0 var(--yellow-d); animation: slam .5s .15s cubic-bezier(.2,1.5,.4,1) both;
}
.sticker.alt { background: var(--mint); box-shadow: 0 4px 0 var(--mint-d); transform: rotate(3deg); text-transform: none; font-size: 16px; }
ul.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; text-align: left; }
ul.rules li { background: var(--glass); border-radius: 14px; padding: 9px 12px; font-size: 15px; font-weight: 600; display: flex; gap: 10px; align-items: flex-start; }
ul.rules li b { font-family: var(--display); font-weight: 400; color: var(--yellow); min-width: 18px; }

/* Buttons */
.btn3d {
  display: block; width: 100%; border: 0; border-radius: 18px; cursor: pointer;
  padding: 14px 18px 11px; font-family: var(--display); font-size: 23px; letter-spacing: .02em; text-transform: uppercase;
  background: var(--yellow); color: var(--dark-ink); box-shadow: 0 6px 0 var(--yellow-d), 0 12px 20px rgba(0,0,0,.35);
  transition: transform .08s, box-shadow .08s, filter .2s;
}
.btn3d:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--yellow-d), 0 4px 8px rgba(0,0,0,.3); }
.btn3d.pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-d), 0 12px 20px rgba(0,0,0,.35); }
.btn3d.pink:active:not(:disabled) { box-shadow: 0 1px 0 var(--pink-d); }
.btn3d.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: 0 6px 0 rgba(0,0,0,.35); font-size: 19px; }
.btn3d.ghost:active:not(:disabled) { box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn3d:disabled { filter: grayscale(.8) brightness(.65); cursor: default; }
.btn3d.ready-pop { animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; }
.actions { display: flex; flex-direction: column; gap: 12px; }
.linkbtn { background: none; border: 0; color: var(--muted); cursor: pointer; font-weight: 700; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }

/* Arena: beans on hexagon tiles */
.stage { position: relative; border-radius: 26px; overflow: hidden; background: linear-gradient(to bottom, rgba(255,255,255,.04), rgba(255,79,163,.16)); }
.stage.tall { min-height: 260px; display: flex; flex-direction: column; justify-content: center; }
.slime { position: absolute; left: -10%; right: -10%; bottom: -18px; height: 46px; background: var(--pink); opacity: .35; border-radius: 50%; filter: blur(2px); }
.arena { position: relative; z-index: 1; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 8px 4px; padding: 16px 8px 18px; min-height: 150px; }
.pl { --w: 40px; display: flex; flex-direction: column; align-items: center; width: calc(var(--w) * 1.42); position: relative; }
.arena.mid .pl { --w: 30px; }
.arena.dense .pl { --w: 21px; }
.arena.big .pl { --w: 56px; }
.pl .bean { width: var(--w); height: calc(var(--w) * 60 / 44); display: block; position: relative; z-index: 1; transform-origin: 50% 95%; animation: wobble 1.9s ease-in-out infinite; animation-delay: var(--d, 0s); }
.pl .hexw { display: block; filter: drop-shadow(0 4px 0 var(--tile-d)); margin-top: calc(var(--w) * -0.2); }
.pl .hex { display: block; width: calc(var(--w) * 1.36); height: calc(var(--w) * 0.44); background: var(--tile); clip-path: polygon(22% 0, 78% 0, 100% 50%, 78% 100%, 22% 100%, 0 50%); }
.pl .nm { font-family: var(--display); font-size: 13px; margin-top: 7px; max-width: 70px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 var(--shadow); }
.arena.dense .nm { display: none; }
.arena.mid .nm { font-size: 11px; }
.pl.me .hex { background: var(--yellow); }
.pl.me .hexw { filter: drop-shadow(0 4px 0 var(--yellow-d)); }
.pl.me .nm { color: var(--yellow); }
.pl.synced .hex { background: var(--mint); }
.pl.synced .hexw { filter: drop-shadow(0 4px 0 var(--mint-d)); }
.pl.sparked .hex { background: var(--yellow); }
.pl.sparked::before { content: "\2605"; position: absolute; top: -16px; color: var(--yellow); font-size: 16px; z-index: 2; text-shadow: 0 2px 0 var(--shadow); animation: pulse 1s infinite; }
.pl.falling { animation: plfall 1.15s cubic-bezier(.55, 0, .9, .45) forwards; z-index: 0; }
.pl.falling.slow { animation-duration: 2.8s; }
.pl.popin { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) both; }
.pl.dropin { animation: dropin 1.1s cubic-bezier(.2, .9, .3, 1.25) both; }

/* Matchmaking */
.mm-count { font-family: var(--display); font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
.mm-count small { font-size: 22px; color: var(--muted); }

/* Build your bean */
.preview { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 0; }
.preview .pl { --w: 74px; }
.swatches { display: flex; gap: 10px; justify-content: center; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.sw.on { border-color: #fff; transform: scale(1.12); }
.field { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.field .lbl { font-family: var(--display); font-size: 16px; letter-spacing: .03em; color: var(--muted); text-transform: uppercase; }
input[type="text"], textarea {
  width: 100%; background: var(--ink); border: 0; border-radius: 16px; color: var(--dark-ink);
  font: 700 17px var(--body); padding: 12px 14px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12);
}
textarea { resize: none; min-height: 92px; line-height: 1.35; }
input[type="text"]:focus, textarea:focus { outline: 3px solid var(--pink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 0; background: rgba(255,255,255,.1); border-radius: 14px; padding: 8px 13px 6px; font-weight: 800; font-size: 15px; cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .08s;
}
.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.chip.on { background: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-d); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input { flex: 1; min-width: 0; accent-color: var(--pink); }
.range-val { font-family: var(--display); font-size: 20px; min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
.hint { font-weight: 700; color: var(--yellow); min-height: 20px; text-align: center; }

/* Countdown */
.cd { font-family: var(--display); font-size: 170px; line-height: 1; color: var(--yellow); text-shadow: 0 10px 0 var(--shadow); }
.cd.go { color: var(--mint); font-size: 130px; }
.cd.anim { animation: countpop .62s cubic-bezier(.2,1.4,.4,1) both; }

/* Question */
.qwrap { position: relative; padding-top: 18px; }
.qcard { background: var(--ink); color: var(--dark-ink); border-radius: 24px; padding: 20px 18px 18px; box-shadow: 0 7px 0 var(--shadow); display: flex; flex-direction: column; gap: 8px; animation: slam .4s cubic-bezier(.2,1.4,.4,1) both; }
.qcard .eyebrow { color: var(--pink); padding-right: 64px; }
.qcard h2 { font-family: var(--display); font-weight: 400; font-size: 27px; line-height: 1.08; margin: 0; padding-right: 8px; text-wrap: balance; }
.ring { position: absolute; top: 0; right: 10px; width: 70px; height: 70px; z-index: 2; }
.ring svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.ring .bg { fill: var(--dark-ink); stroke: rgba(255,255,255,.12); stroke-width: 7; }
.ring .fg { fill: none; stroke: var(--mint); stroke-width: 7; stroke-linecap: round; transition: stroke .2s; }
.ring.hot .fg { stroke: var(--coral); }
.ring.hot { animation: pulse .5s ease-in-out infinite; }
.ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 27px; color: #fff; font-variant-numeric: tabular-nums; }
.tag-anchor { align-self: flex-start; font-family: var(--display); font-size: 13px; background: var(--mint); color: var(--dark-ink); border-radius: 8px; padding: 2px 8px 0; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt {
  --c: var(--coral); --cd: var(--coral-d);
  background: var(--c); color: #fff; border: 0; border-radius: 20px; box-shadow: 0 6px 0 var(--cd); cursor: pointer;
  min-height: 112px; padding: 12px 12px 10px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  font-weight: 800; font-size: 15.5px; line-height: 1.15; transition: transform .08s; animation: pop .35s cubic-bezier(.3,1.6,.5,1) both;
}
.opt:nth-child(2) { --c: var(--blue); --cd: var(--blue-d); animation-delay: .05s; }
.opt:nth-child(3) { --c: var(--yellow); --cd: var(--yellow-d); color: var(--dark-ink); animation-delay: .1s; }
.opt:nth-child(4) { --c: var(--mint); --cd: var(--mint-d); color: var(--dark-ink); animation-delay: .15s; }
.opt:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--cd); }
.opt svg { width: 24px; height: 24px; display: block; }
.slider-box { background: var(--glass); border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.slider-box input { width: 100%; accent-color: var(--pink); height: 28px; }
.slider-ends { display: flex; justify-content: space-between; font-family: var(--display); font-size: 22px; }
.slider-ends span:first-child { color: var(--blue); } .slider-ends span:last-child { color: var(--pink); }
.player { display: flex; align-items: center; gap: 12px; background: var(--glass); border-radius: 18px; padding: 10px 12px; }
.player button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--pink); color: #fff; cursor: pointer; box-shadow: 0 4px 0 var(--pink-d); flex: none; font-size: 16px; }
.wave { display: flex; gap: 3px; align-items: center; height: 34px; flex: 1; min-width: 0; overflow: hidden; }
.wave i { width: 4px; border-radius: 2px; background: rgba(255,255,255,.3); display: block; flex: none; }
.wave.on i { background: var(--pink); animation: eq .5s ease-in-out infinite alternate; }
.wave.on i:nth-child(3n) { animation-delay: .15s; } .wave.on i:nth-child(3n+1) { animation-delay: .3s; }

.stamp { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; pointer-events: none; background: rgba(12,4,29,.45); }
.stamp span {
  font-family: var(--display); font-size: 50px; color: var(--yellow); border: 6px solid var(--yellow); border-radius: 18px;
  padding: 6px 18px 2px; background: rgba(12,4,29,.75); text-shadow: 0 4px 0 var(--shadow); transform: rotate(-8deg);
  animation: stamp .38s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp.time span { color: var(--coral); border-color: var(--coral); }

/* Sync + qualified rays */
.rays-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 0 10px; }
.rays { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; z-index: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(61,220,151,.16) 0 9deg, transparent 9deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 62%); mask: radial-gradient(circle, #000 20%, transparent 62%);
  animation: spin 16s linear infinite; }
.rays.gold { background: repeating-conic-gradient(from 0deg, rgba(255,210,63,.2) 0 9deg, transparent 9deg 18deg); }
.rays.grey { background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.05) 0 9deg, transparent 9deg 18deg); }
.rays-wrap > *:not(.rays) { position: relative; z-index: 1; }
.combo { font-family: var(--display); font-size: 18px; color: var(--dark-ink); background: var(--mint); border-radius: 12px; padding: 4px 12px 2px; box-shadow: 0 4px 0 var(--mint-d); animation: slam .5s .2s cubic-bezier(.2,1.5,.4,1) both; transform: rotate(-3deg); }

/* Spark */
.token { width: 92px; height: 92px; align-self: center; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 30%, #fff3b0, var(--yellow) 45%, var(--yellow-d)); box-shadow: 0 6px 0 #8a6606, 0 0 40px rgba(255,210,63,.55); animation: float 2.2s ease-in-out infinite; }
.token svg { width: 46px; height: 46px; }
.token.thrown { animation: throw .7s cubic-bezier(.5,0,.8,.4) forwards; }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 12px; }
.cand { background: var(--glass); border: 3px solid transparent; border-radius: 20px; padding: 10px 4px 8px; cursor: pointer; display: flex; justify-content: center; box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.cand .pl { --w: 44px; }
.cand .pl .hexw { display: none; }
.cand.on { border-color: var(--yellow); background: rgba(255,210,63,.15); }

/* Split */
.split-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.bigcount { font-family: var(--display); font-size: 58px; line-height: .9; font-variant-numeric: tabular-nums; color: var(--yellow); text-shadow: 0 5px 0 var(--shadow); }
.bigcount.bump { animation: bump .25s; }
.bigcount small { font-size: 17px; color: var(--muted); margin-left: 4px; text-shadow: none; }
.notes { display: flex; flex-direction: column; gap: 8px; min-height: 10px; }
.callout { display: flex; gap: 10px; align-items: center; background: var(--glass); border-radius: 16px; padding: 9px 12px; font-weight: 700; font-size: 15px; text-align: left; animation: slidein .35s cubic-bezier(.2,1.4,.4,1) both; border: 2px solid rgba(255,255,255,.1); }
.callout b { font-family: var(--display); font-weight: 400; font-size: 13px; padding: 2px 8px 0; border-radius: 8px; background: rgba(255,255,255,.12); white-space: nowrap; }
.callout.sp b { background: var(--yellow); color: var(--dark-ink); }
.callout.back { border-color: var(--mint); }
.callout.back b { background: var(--mint); color: var(--dark-ink); }

/* Finalist cards */
.fan { display: flex; flex-direction: column; gap: 14px; }
.card3d { perspective: 900px; }
.card-inner { position: relative; display: block; width: 100%; height: 132px; border: 0; padding: 0; background: none; cursor: pointer; transform-style: preserve-3d; transition: transform .65s cubic-bezier(.3,1.35,.5,1); text-align: left; }
.card3d.flipped .card-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; gap: 14px; padding: 12px 16px; box-shadow: 0 7px 0 var(--shadow); overflow: hidden; }
.face.backside { background: var(--pink); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 12px, transparent 12px 24px); justify-content: space-between; border: 4px solid #fff; }
.cb-logo { font-family: var(--display); font-size: 30px; color: #fff; text-shadow: 0 3px 0 var(--pink-d); }
.cb-logo b { color: var(--yellow) !important; }
.cb-q { font-family: var(--display); font-size: 62px; color: var(--yellow); text-shadow: 0 4px 0 var(--pink-d); line-height: 1; }
.cb-tap { position: absolute; bottom: 10px; left: 16px; font-family: var(--display); font-size: 13px; letter-spacing: .06em; color: #fff; opacity: .9; }
.face.frontside { transform: rotateY(180deg); background: var(--sky-3); border: 4px solid var(--yellow); }
.face.frontside.holo { border-color: #fff; color: var(--dark-ink);
  background: linear-gradient(115deg, #ffb3dc, #b3ecff, #fff1a8, #c4ffe2, #e2c4ff, #ffb3dc); background-size: 400% 400%; animation: holo 5s linear infinite; }
.face .pl { --w: 50px; }
.face .pl .hexw { display: none; }

const log = (id, r, text, kind = '') => { (S.log[id] = S.log[id] || []).push({ r, text, kind }); };

function startGame() {
  const want = S.me.seeking === 'Women' ? ['w'] : S.me.seeking === 'Men' ? ['m'] : ['w', 'm'];
  S.pool = PLAYERS.filter(p => want.includes(p.g)).map(p => p.id);
  const crowd = Array.from({ length: CROWD_TOTAL - S.pool.length }, (_, i) => 'c' + (i + 1));
  const mixed = []; const a = [...S.pool], b = [...crowd];
  while (a.length || b.length) { if (b.length) mixed.push(b.shift()); if (b.length) mixed.push(b.shift()); if (a.length) mixed.push(a.shift()); }
  S.bucket = mixed;
  S.round = 0; S.answers = [null, null, null, null, null];
  S.fallen = []; S.fellAt = {}; S.known = []; S.streak = {}; S.prevSync = []; S.flipped = {}; S.revealEnd = null; S.locked = false; S.sparks = {}; S.log = {}; S.decisions = {}; S.drafts = {}; S.finalists = []; S.wild = null;
}

function faceOn(id) { return isRich(id) && (S.round >= 2 || S.known.includes(id) || sparkedIds().includes(id)); }

function findSync(r) {
  const R = ROUNDS[r], a = S.answers[r];
  if (a == null) return [];
  if (R.type === 'music' && !(a.chips.length || a.text.trim())) return [];
  if (R.type === 'text' && !a.trim()) return [];
  const ids = S.bucket.filter(isRich);
  const scored = ids.map(id => {
    const pa = P(id).a[r]; let s;
    if (R.type === 'choice') s = pa === a ? 0 : 6;
    else if (R.type === 'slider') s = Math.abs(pa - a) / 10;
    else {
      const d1 = roundDelta(r, a), d2 = roundDelta(r, pa);
      s = Math.hypot(...d1.map((x, i) => x - d2[i]));
      if (R.type === 'music') s -= pa.chips.filter(c => a.chips.includes(c)).length * 2;
    }
    return { id, s: s + dist(id, r + 1) * 0.15 };
  }).sort((x, y) => x.s - y.s);
  if (!scored.length) return [];
  const out = [scored[0].id];
  if (scored[1] && scored[1].s - scored[0].s < 0.6) out.push(scored[1].id);
  return out;
}

function doSplit(r) {
  const n = r + 1, before = [...S.bucket];
  const rich = before.filter(isRich).sort(byDist(n));
  const crowd = before.filter(id => !isRich(id));
  let reunion = null, keep;
  if (r === 3) {
    const gone = S.fallen.filter(id => isRich(id) && (S.fellAt[id] === 2 || S.known.includes(id))).sort(byDist(n));
    if (gone.length) reunion = gone[0];
  }
  if (r === 4) {
    const top = rich.slice(0, 2), rest = rich.slice(2);
    const u = vecUpTo(S.answers, n);
    let best = null, bestGap = -1, bestDim = 0;
    rest.forEach(id => {
      const v = vecUpTo(P(id).a, n);
      v.forEach((x, i) => { const g = Math.abs(x - u[i]); if (g > bestGap) { bestGap = g; best = id; bestDim = i; } });
    });
    keep = best ? [...top, best] : rich.slice(0, 3);
    S.wild = best ? { id: best, dim: DIMS[bestDim] } : null;
    S.finalists = keep;
  } else {
    const slots = KEEP[r] - (reunion ? 1 : 0);
    keep = rich.slice(0, slots);
    if (keep.length < slots) keep = keep.concat(crowd.slice(0, slots - keep.length));
  }
  const falling = before.filter(id => !keep.includes(id));
  falling.forEach(id => { S.fallen.push(id); S.fellAt[id] = r; if (isRich(id) && faceOn(id)) log(id, r, 'Fell to another platform'); });
  if (reunion) {
    keep.push(reunion);
    S.fallen = S.fallen.filter(x => x !== reunion);
    log(reunion, r, 'Came back to your platform', 'hit');
  }
  S.bucket = keep;
  S.lastSplit = { r, before, falling, reunion, keepCount: keep.length };
  if (r === 4) {
    keep.forEach(id => {
      log(id, r, 'Made it to the end with you', 'hit');
      if (hash(id) % 2 === 0) log(id, 3, 'Sparked you', 'sp');
    });
  }
}

/* ---------- Audio clip for the music round ---------- */
let AC = null;
function playClip() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + 0.05;
    const master = AC.createGain(); master.gain.value = 0.22;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    master.connect(lp); lp.connect(AC.destination);
    const voice = (f, s, d, type, vol) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(vol, s + 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(master); o.start(s); o.stop(s + d + 0.05);
    };
    const chords = [[220, 261.63, 329.63], [174.61, 220, 261.63], [196, 261.63, 329.63], [196, 246.94, 293.66]];
    chords.forEach((c, i) => c.forEach(f => voice(f, t0 + i * 2, 2.3, 'triangle', 0.18)));
    [659.25, 587.33, 523.25, 493.88, 440, 523.25, 493.88, 392].forEach((f, i) => voice(f, t0 + i, 0.95, 'sine', 0.22));
    const w = document.getElementById('wave'); if (w) { w.classList.add('on'); setTimeout(() => w.classList.remove('on'), 8200); }
  } catch (e) { toast('Sound is unavailable here. Answer from the title alone.'); }
}

/* ---------- Sound effects ---------- */
function ensureAC() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function tone(f, start, dur, type, vol, f2) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, start);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, start + dur);
  g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(vol, start + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g); g.connect(AC.destination); o.start(start); o.stop(start + dur + 0.03);
}
function sfx(name) {
  try {
    if (!AC || S.muted) return;
    const t = AC.currentTime + 0.01;
    const seq = (notes, gap, dur, type, vol) => notes.forEach((f, i) => tone(f, t + i * gap, dur, type, vol));
    ({
      tick: () => tone(1250, t, .05, 'square', .04),
      pop: () => tone(620, t, .08, 'triangle', .07, 1150),
      count: () => tone(523, t, .16, 'square', .06),
      go: () => { tone(784, t, .32, 'square', .07); tone(1175, t + .04, .32, 'square', .04); },
      lock: () => seq([523, 784], .08, .14, 'triangle', .12),
      sync: () => seq([523, 659, 784, 1047], .075, .26, 'sine', .13),
      solo: () => tone(330, t, .3, 'triangle', .07, 260),
      fall: () => tone(720, t, .45, 'sine', .06, 130),
      spark: () => tone(880, t, .28, 'triangle', .1, 1900),
      flip: () => tone(380, t, .14, 'triangle', .08, 950),
      back: () => seq([392, 523, 659, 784], .07, .2, 'triangle', .1),
      win: () => seq([523, 659, 784, 1047, 784, 1047, 1319], .1, .3, 'square', .05),
      time: () => tone(300, t, .35, 'sawtooth', .05, 160)
    })[name]();
  } catch (e) {}
}

      <button class="btn3d" data-act="sendSpark" ${S.sparkSel ? '' : 'disabled'}>${S.sparkSel ? 'Throw it at ' + esc(P(S.sparkSel).name) : 'Pick someone'}</button>
      <button class="btn3d ghost" data-act="skipSpark">${S.round < 4 ? 'Save it for later' : "Don't use it"}</button>
    </div>
  </div>`;
};

V.split = () => {
  const L = S.lastSplit, last = L.r === 4;
  return `
  <div class="scene">
    <div class="split-head">
      <div><div class="eyebrow">Round ${L.r + 1}</div><div class="slam sm">${last ? 'Final split' : 'Split!'}</div></div>
      <div class="bigcount" id="bigcount">${L.before.length + 1}<small>left</small></div>
    </div>
    <div class="stage tall">${arena(L.before, { id: 'arena' })}<div class="slime"></div></div>
    <div class="notes" id="notes" aria-live="polite"></div>
    <div class="grow"></div>
    <button class="btn3d pink" id="nextBtn" data-act="next" disabled>${last ? 'See results' : 'Next round'}</button>
  </div>`;
};

V.qualified = () => `
  <div class="scene center">
    <div class="rays-wrap"><div class="rays gold"></div>
      <div class="slam huge y" style="font-size:66px">Qualified!</div>
      ${arena(S.finalists, { cls: 'big' })}
    </div>
    <p class="lede">You made it to the end with 3 people. You're their finalist too.</p>
    <div class="grow"></div>
    <button class="btn3d pink" data-act="go" data-to="finalists">Open your cards</button>
  </div>`;

V.finalists = () => {
  const done = S.finalists.every(id => S.decisions[id]);
  const allFlipped = S.finalists.every(id => S.flipped[id]);
  return `
  <div class="scene">
    <div class="slam sm">Your finalists</div>
    <p class="muted">${allFlipped ? 'Tap a card to see the full story.' : 'Tap a card to flip it.'}</p>
    <div class="fan">${S.finalists.map(id => {
      const p = P(id), wild = S.wild && S.wild.id === id, st = S.decisions[id];
      const syncs = (S.log[id] || []).filter(e => e.text.startsWith('Synced')).map(e => e.text.replace('Synced on ', ''));
      const why = wild ? `You differ on ${DIM_WORDS[S.wild.dim]}. Everything else lines up.` : syncs.length ? `Synced on ${syncs.join(', ')}` : 'Close across the board';
      return `<div class="card3d ${S.flipped[id] ? 'flipped' : ''}"><button class="card-inner" data-act="card" data-id="${id}" aria-label="${S.flipped[id] ? 'Open ' + esc(p.name) : 'Flip card'}">
        <span class="face backside"><span class="cb-logo">soul<b>it</b></span><span class="cb-q">?</span><span class="cb-tap">TAP TO REVEAL</span></span>
        <span class="face frontside ${wild ? 'holo' : ''}">${pl(id, { face: true })}
          <span class="info"><span class="badge">${wild ? 'Wildcard' : 'Strong match'}</span><span class="name">${esc(p.name)}, ${p.age}</span>
          <span class="why">${esc(why)}</span>
          <span class="status ${st === 'sent' ? 'sent' : ''}">${st === 'sent' ? '✓ Request sent' : st === 'passed' ? 'Passed quietly' : `${p.km} km away · tap for story`}</span></span>
        </span></button></div>`;
    }).join('')}</div>
    <div class="grow"></div>
    <button class="btn3d ${done ? 'pink' : 'ghost'}" data-act="finish" ${done ? '' : 'disabled'}>${done ? 'Finish the run' : 'Message or pass everyone'}</button>
  </div>`;
};

V.profile = () => {
  const id = S.open, p = P(id), wild = S.wild && S.wild.id === id;
  const events = S.log[id] || [];
  const rows = ROUNDS.map((R, r) => {
    const ev = events.filter(e => e.r === r);
    const kind = ev.some(e => e.kind === 'sp') ? 'sp' : ev.some(e => e.kind === 'hit') ? 'hit' : '';
    const text = ev.length ? ev.map(e => esc(e.text)).join(' · ') : 'Same platform';
    return `<div class="rr ${kind}"><span class="rn">${r + 1}</span><span><span class="rt">${esc(R.theme)}</span>${text}</span></div>`;
  }).join('');
  const anchor = ROUNDS[4], mine = S.answers[4], theirs = p.a[4], same = mine === theirs;
  const starters = [
    `Tell me more about "${trunc(p.a[3], 40)}"`,
    same ? "We'd both run back in for the same thing. Explain yourself." : `You'd save "${trunc(anchor.opts[theirs].t, 30)}" from a fire? Defend it.`,
    `Question swap? You answer mine: "${ROUNDS[0].q}"`
  ];
  S._starters = starters;
  const st = S.decisions[id];
  const composer = st
    ? `<div class="decided ${st}">${st === 'sent' ? `✓ Request sent. ${esc(p.name)} sees it next to your match replay.` : `Passed quietly. ${esc(p.name)} won't be told.`}</div>`
    : `<div class="sec"><div class="sec-h">Make your move</div>
        <div class="chips">${starters.map((s, i) => `<button class="chip" data-act="starter" data-i="${i}">${esc(trunc(s, 44))}</button>`).join('')}</div>
        <textarea id="f-msg" maxlength="300" placeholder="Start from something you shared">${esc(S.drafts[id] || '')}</textarea>
        <div class="actions"><button class="btn3d pink" data-act="send">Send request</button><button class="btn3d ghost" data-act="pass">Pass quietly</button></div></div>`;
  return `
  <div class="scene">
    <button class="backlink" data-act="back">‹ Cards</button>
    <div class="prof ${wild ? 'holo' : ''}">
      <div class="prof-top">${pl(id, { face: true })}<div><span class="badge">${wild ? 'Wildcard' : 'Strong match'}</span><div class="name">${esc(p.name)}, ${p.age}</div><div class="meta">${p.km} km away · also looking for ${esc((S.me.intent || 'something real').toLowerCase())}</div></div></div>
      <p class="bio">${esc(p.bio)}</p>
    </div>
    <div class="sec"><div class="sec-h">Match replay</div><div class="replay">${rows}</div></div>
    <div class="sec"><div class="sec-h">Same question</div><p class="muted small">${esc(anchor.q)}</p>
      ${same ? '<span class="same-pick">Same pick!</span>' : ''}
      <div class="vs"><div class="bubble"><b>You</b>${mine == null ? 'Ran out of time' : esc(anchor.opts[mine].t)}</div><span class="vs-badge">${same ? '=' : 'VS'}</span><div class="bubble"><b>${esc(p.name)}</b>${esc(anchor.opts[theirs].t)}</div></div></div>
    <div class="sec"><div class="sec-h">Unlocked answers</div><div class="stickers">
      <div class="stk"><div class="q">Their soundtrack scene</div><div class="a">“${esc(p.a[2].text)}”</div></div>
      <div class="stk"><div class="q">Home, without the address</div><div class="a">“${esc(p.a[3])}”</div></div>
      <div class="stk"><div class="q">${esc(p.own[0])}</div><div class="a">“${esc(p.own[1])}”</div></div>
    </div></div>
    ${composer}
  </div>`;
};

V.end = () => {
  const synced = new Set(Object.entries(S.log).filter(([, ev]) => ev.some(e => e.text.startsWith('Synced'))).map(([id]) => id)).size;
  const back = Object.values(S.log).flat().filter(e => e.text.startsWith('Came back')).length;
  const sent = Object.values(S.decisions).filter(x => x === 'sent').length;
  return `
  <div class="scene">
    <div class="slam y" style="text-align:center">Run complete</div>
    <div class="stats">
      <div class="stat"><span class="n">${synced}</span><span class="l">people synced</span></div>
      <div class="stat"><span class="n">${back}</span><span class="l">comebacks</span></div>
      <div class="stat"><span class="n">${SPARKS_PER_GAME - sparkLeft()}/${SPARKS_PER_GAME}</span><span class="l">spark thrown</span></div>
      <div class="stat"><span class="n">${sent}</span><span class="l">requests sent</span></div>
    </div>
    <div class="sec"><div class="sec-h">Next game</div>
      <div class="meter"><i></i></div>
      <p class="muted small">3 of 20 new players near you. Your next game unlocks when the bar fills, so you only play when there are good people to meet.</p></div>
    <ul class="rules">
      <li><b>→</b>People you messaged see your request with your match replay, then accept or pass quietly.</li>
      <li><b>⏳</b>Finalists you didn't act on expire when the 72-hour window closes.</li>
    </ul>
    <p class="fine">Prototype: you can play again right away. Answer differently and different people stay with you.</p>
    <div class="actions"><button class="btn3d pink" data-act="again">Play again</button><button class="btn3d ghost" data-act="go" data-to="finalists">Back to cards</button></div>
  </div>`;
};

/* ---------- Render ---------- */
function render() {
  clearTimers();
  $('#app').innerHTML = hud() + V[S.screen]();
  const sc = document.querySelector('.scene'); if (sc) sc.scrollTop = 0;
  ({
    matchmaking: runMatchmaking, countdown: runCountdown, question: startTimer, split: runSplit,
    qualified: () => { sfx('win'); confetti(); },
    finalists: startClock, profile: startClock
  })[S.screen]?.();
}

function runMatchmaking() {
  const ar = $('#arena'), ids = S.bucket;
  let i = 0;
  const step = () => {
    if (i >= ids.length) {
      $('#mmTitle').textContent = 'Room full!';
      const b = $('#mmGo'); b.disabled = false; b.classList.add('ready-pop'); sfx('go');
      return;
    }
    ar.insertAdjacentHTML('beforeend', pl(ids[i], { extra: 'popin' }));
    i++; $('#mmN').textContent = i + 1;
    if (i % 3 === 0) sfx('pop');
    later(step, REDUCED ? 0 : 45 + Math.random() * 50);
  };
  later(step, 500);
}

function runCountdown() {
  const steps = ['3', '2', '1', 'GO!'];
  steps.forEach((s, i) => later(() => {
    const el = $('#cd'); if (!el) return;
    el.textContent = s; el.className = 'cd' + (s === 'GO!' ? ' go' : '');
    void el.offsetWidth; el.classList.add('anim');
    sfx(s === 'GO!' ? 'go' : 'count');
  }, i * 650));
  later(() => {
    S.screen = 'question'; S.chips = []; S.locked = false; render();
    if (ROUNDS[S.round].type === 'music') playMusic();
  }, steps.length * 650);
}

function startTimer() {
  const R = ROUNDS[S.round], total = R.time * 1000, end = Date.now() + total, C = 182.2;
  let lastSec = R.time;
  const tick = () => {
    const left = Math.max(0, end - Date.now()), sec = Math.ceil(left / 1000);
    const fg = $('#ringfg'), n = $('#tnum'), ring = $('#ring');
    if (fg) fg.style.strokeDashoffset = C * (1 - left / total);
    if (n) n.textContent = sec;
    if (ring) ring.classList.toggle('hot', sec <= 3);
    if (sec !== lastSec) { lastSec = sec; if (sec <= 3 && sec > 0) sfx('tick'); }
    if (left <= 0) { clearInterval(T); T = null; timeUp(); }
  };
  tick(); T = setInterval(tick, 80);
}
function currentAnswer() {
  const R = ROUNDS[S.round];
  if (R.type === 'slider') return Number(($('#f-slider') || { value: 50 }).value);
  if (R.type === 'music') return { chips: [...S.chips], text: ($('#f-text') || { value: '' }).value };
  if (R.type === 'text') return ($('#f-text') || { value: '' }).value;
  return null;
}
function timeUp() { submit(currentAnswer(), true); }
function stamp(text, cls = '') {
  document.querySelector('.stamp')?.remove();
  $('#phone').insertAdjacentHTML('beforeend', `<div class="stamp ${cls}"><span>${text}</span></div>`);
}
function submit(val, timedOut = false) {
  if (S.locked) return;
  S.locked = true;
  clearInterval(T); T = null;
  const r = S.round;
  S.answers[r] = val;
  const prev = S.prevSync || [];
  S.syncNow = findSync(r);
  S.syncNow.forEach(id => {
    if (!S.known.includes(id)) S.known.push(id);
    S.streak[id] = prev.includes(id) ? (S.streak[id] || 1) + 1 : 1;
    log(id, r, 'Synced on ' + ROUNDS[r].theme, 'hit');
  });
  S.prevSync = [...S.syncNow];
  S.chips = []; S.sparkSel = null;
  stamp(timedOut ? "Time's up!" : 'Locked in!', timedOut ? 'time' : '');
  sfx(timedOut ? 'time' : 'lock');
  later(() => {
    document.querySelector('.stamp')?.remove();
    S.screen = 'sync'; render();
    sfx(S.syncNow.length ? 'sync' : 'solo');
  }, 950);
}

function bumpCount(n) {
  const b = $('#bigcount'), h = $('#hudcount');
  if (b) { b.innerHTML = `${n}<small>left</small>`; b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  if (h) h.textContent = n;
}
function runSplit() {
  const L = S.lastSplit, ar = $('#arena'), notes = $('#notes');
  const sp = sparkedIds();
  const isKnown = id => isRich(id) && faceOn(id) && (S.known.includes(id) || sp.includes(id));
  const order = [...L.falling.filter(id => !isKnown(id)), ...L.falling.filter(id => isKnown(id) && !sp.includes(id)), ...L.falling.filter(id => sp.includes(id))];
  const many = order.length > 10;
  let delay = 700, n = L.before.length + 1;
  if (many) later(() => { $('#phone').classList.add('shake'); later(() => $('#phone').classList.remove('shake'), 500); }, delay);
  order.forEach((id, i) => {
    const el = ar.querySelector(`[data-id="${id}"]`);
    const slow = sp.includes(id), known = isKnown(id);
    later(() => {
      if (el) { el.classList.add('falling'); if (slow) el.classList.add('slow'); }
      n--; bumpCount(n);
      if (!many || i % 4 === 0 || known) sfx('fall');
      if (known) {
        const [He] = pron(id);
        notes.insertAdjacentHTML('beforeend', `<div class="callout ${slow ? 'sp' : ''}"><b>${slow ? '★ Sparked' : 'Synced'}</b><span>${esc(P(id).name)} fell to another platform. ${He}'s still playing, just not with you.</span></div>`);
      }
    }, delay);
    delay += slow ? 1500 : known ? 600 : many ? 40 : 220;
  });
  let endAt = delay + 900;
  if (L.reunion) {
    const id = L.reunion;
    later(() => {
      ar.insertAdjacentHTML('beforeend', pl(id, { extra: 'dropin' }));
      n++; bumpCount(n); sfx('back');
      notes.insertAdjacentHTML('beforeend', `<div class="callout back"><b>Comeback!</b><span>${esc(P(id).name)} is back. Your last answers pulled you together again.</span></div>`);
    }, delay + 500);
    endAt = delay + 1700;
  }
  later(() => {
    const b = $('#nextBtn'); if (b) { b.disabled = false; b.classList.add('ready-pop'); }
    if (!notes.children.length) notes.insertAdjacentHTML('beforeend', `<div class="callout"><b>Moved</b><span>${L.falling.length} players went to other platforms.</span></div>`);
  }, endAt);
}

function startClock() {
  if (!S.revealEnd) S.revealEnd = Date.now() + 72 * 3600 * 1000;
  const tick = () => {
    const s = Math.max(0, Math.floor((S.revealEnd - Date.now()) / 1000));
    const pad = x => String(x).padStart(2, '0');
    const c = $('#clock'); if (c) c.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  };
  tick(); clockT = setInterval(tick, 1000);
}

function confetti() {
  if (REDUCED) return;
  const phone = $('#phone'), r = phone.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const c = document.createElement('canvas'); c.className = 'confetti'; c.width = r.width * dpr; c.height = r.height * dpr;
  phone.appendChild(c);
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const cols = ['--pink', '--yellow', '--mint', '--blue', '--coral'].map(v => css.getPropertyValue(v).trim());
  const parts = Array.from({ length: 150 }, () => ({
    x: r.width / 2 + (Math.random() - .5) * 60, y: r.height * .3,
    vx: (Math.random() - .5) * 9, vy: -Math.random() * 10 - 3, s: 5 + Math.random() * 6,
    a: Math.random() * 6, va: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  const frame = now => {
    const t = now - t0;
    ctx.clearRect(0, 0, r.width, r.height);
    parts.forEach(p => {
      p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, 1 - t / 3000); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (t < 3000) requestAnimationFrame(frame); else c.remove();
  };
  requestAnimationFrame(frame);
}

/* ---------- Actions ---------- */
const A = {
  go: d => { S.screen = d.to; render(); },
  mute: () => { S.muted = !S.muted; const b = document.querySelector('[data-act="mute"]'); if (b) { b.innerHTML = S.muted ? ICON.off : ICON.on; b.setAttribute('aria-label', S.muted ? 'Turn sound on' : 'Turn sound off'); } },
  set: d => { S.me[d.k] = d.v; sfx('pop'); render(); },
  hue: d => { S.me.hue = Number(d.v); sfx('pop'); render(); },
  prio: d => {
    const p = S.me.prios, i = p.indexOf(d.v);
    if (i >= 0) p.splice(i, 1); else { p.push(d.v); if (p.length > 2) p.shift(); }
    sfx('pop'); render();
  },
  toLobby: () => {
    const m = S.me, miss = [];
    if (!m.name.trim()) miss.push('your name');
    if (!m.gender) miss.push('who you are');
    if (!m.seeking) miss.push('who to show you');
    if (!m.intent) miss.push('what you want');
    if (miss.length) { $('#hint').textContent = 'Add ' + miss.join(', ') + ' to ready up.'; sfx('time'); return; }
    startGame(); S.screen = 'matchmaking'; render();
  },
  enter: () => { S.round = 0; S.screen = 'roundCard'; render(); sfx('go'); },
  ready: () => { S.screen = 'countdown'; render(); },
  replay: () => playMusic(),
  pick: d => submit(Number(d.i)),
  mchip: d => {
    const i = S.chips.indexOf(d.v);
    if (i >= 0) S.chips.splice(i, 1); else S.chips.push(d.v);
    sfx('pop');
    document.querySelectorAll('[data-act="mchip"]').forEach(b => { const on = S.chips.includes(b.dataset.v); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  },
  lock: () => submit(currentAnswer()),
  toSpark: () => {
    if (canSpark() && S.bucket.some(id => faceOn(id))) { S.screen = 'spark'; render(); }
    else { doSplit(S.round); S.screen = 'split'; render(); }
  },
  sel: d => { S.sparkSel = S.sparkSel === d.id ? null : d.id; sfx('pop'); render(); },
  sendSpark: () => {
    if (!S.sparkSel) return;
    const id = S.sparkSel;
    S.sparks[S.round] = id; log(id, S.round, 'You sparked ' + pron(id)[1], 'sp');
    sfx('spark'); $('#token')?.classList.add('thrown');
    later(() => { doSplit(S.round); S.screen = 'split'; render(); }, 650);
  },
  skipSpark: () => { doSplit(S.round); S.screen = 'split'; render(); },
  next: () => {
    if (S.round < 4) { S.round++; S.screen = 'roundCard'; } else S.screen = 'qualified';
    render();
  },
  card: (d, el) => {
    const id = d.id;
    if (!S.flipped[id]) {
      S.flipped[id] = true; sfx('flip');
      el.closest('.card3d').classList.add('flipped');
      el.setAttribute('aria-label', 'Open ' + P(id).name);
      return;
    }
    S.open = id; S.screen = 'profile'; render();
  },
  back: () => { S.screen = 'finalists'; render(); },
  starter: d => { const t = $('#f-msg'); t.value = S._starters[Number(d.i)]; S.drafts[S.open] = t.value; t.focus(); sfx('pop'); },
  send: () => {
    const t = $('#f-msg'), v = t ? t.value.trim() : '';
    if (!v) { toast('Write a first line, or tap a starter.'); return; }
    S.decisions[S.open] = 'sent'; sfx('sync'); toast(`Request sent to ${P(S.open).name}.`);
    S.screen = 'finalists'; render();
  },
  pass: () => { S.decisions[S.open] = 'passed'; toast(`Passed. ${P(S.open).name} won't be told.`); S.screen = 'finalists'; render(); },
  finish: () => { S.screen = 'end'; render(); sfx('win'); },
  again: () => { const muted = S.muted; S = fresh(S.me); S.muted = muted; startGame(); S.screen = 'matchmaking'; render(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  ensureAC();
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-name') { S.me.name = t.value; const nm = document.querySelector('.preview .nm'); if (nm) nm.textContent = t.value || 'You'; }
  if (t.id === 'f-amin' || t.id === 'f-amax') {
    let lo = Number($('#f-amin').value), hi = Number($('#f-amax').value);
    if (lo > hi) { if (t.id === 'f-amin') hi = lo; else lo = hi; $('#f-amin').value = lo; $('#f-amax').value = hi; }
    S.me.ageMin = lo; S.me.ageMax = hi; $('#f-aval').textContent = `${lo}–${hi}`;
  }
  if (t.id === 'f-msg') S.drafts[S.open] = t.value;
});

/* ---------- Boot (keeps progress across live updates) ---------- */
function start(data) {
  if (data && data.S) {
    const base = fresh();
    S = { ...base, ...data.S, me: { ...base.me, ...data.S.me } };
    if (['countdown', 'question'].includes(S.screen)) S.screen = 'roundCard';
    if (S.screen === 'matchmaking') startGame();
  }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body></html>
